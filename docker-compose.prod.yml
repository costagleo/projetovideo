version: "3.8"

# =============================================
# PRODUÇÃO — Portainer Stack (Git Deploy + Swarm + Traefik)
# Repo: https://github.com/costagleo/projetovideo.git
# Redis externo: github-gerador-relatorios_redis:6379/1
# URL: video.axidia.com.br
#
# VARIÁVEIS SENSÍVEIS — configure no Portainer (Stack > Environment):
#   MASTER_EMAIL, MASTER_PASSWORD, SECRET_KEY
# =============================================

services:
  video_api:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-api:latest
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - interna
      - externa
    volumes:
      - video_data:/data
    environment:
      # --- Conexões ---
      REDIS_URL: "redis://github-gerador-relatorios_redis:6379/1"
      DB_PATH: "/data/db/app.db"
      DATA_DIR: "/data"
      CURRENT_SECTION_PATH: "/data/projects/current"
      # --- Sensíveis (definir no Portainer > Stack > Environment variables) ---
      MASTER_EMAIL: "${MASTER_EMAIL:-admin@axidia.com.br}"
      MASTER_PASSWORD: "${MASTER_PASSWORD:?Defina MASTER_PASSWORD no Portainer}"
      SECRET_KEY: "${SECRET_KEY:?Defina SECRET_KEY no Portainer}"
      # --- Auth ---
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      ALGORITHM: "HS256"
      REGISTRATION_MODE: "invite_only"
      # --- Limites ---
      MAX_PROJECT_BYTES: "21474836480"
      WORKER_CONCURRENCY: "1"
      DEFAULT_PRESET: "balanced"
      # --- App ---
      BASE_URL: "https://video.axidia.com.br"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 600M
      labels:
        traefik.enable: "true"
        traefik.docker.network: "externa"
        traefik.http.routers.video.rule: "Host(`video.axidia.com.br`)"
        traefik.http.routers.video.entrypoints: "websecure"
        traefik.http.routers.video.tls.certresolver: "le"
        traefik.http.services.video.loadbalancer.server.port: "8000"

  video_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: video-worker:latest
    command: rq worker -u redis://github-gerador-relatorios_redis:6379/1 video_jobs
    networks:
      - interna
    volumes:
      - video_data:/data
    environment:
      REDIS_URL: "redis://github-gerador-relatorios_redis:6379/1"
      DB_PATH: "/data/db/app.db"
      DATA_DIR: "/data"
      CURRENT_SECTION_PATH: "/data/projects/current"
      WORKER_CONCURRENCY: "1"
      DEFAULT_PRESET: "balanced"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.30"
          memory: 3G

networks:
  externa:
    external: true
  interna:
    external: true

volumes:
  video_data:
    external: true
