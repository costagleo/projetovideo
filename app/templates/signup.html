{% extends "base.html" %}
{% block title %}Cadastro — Axidia Video Render{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-400">Axidia Video Render</h1>
            <p class="text-gray-400 mt-2">Crie sua conta via convite</p>
        </div>

        <div class="bg-gray-800 rounded-lg p-8 shadow-xl">
            <div id="signup-error" class="hidden bg-red-900/50 border border-red-700 text-red-300 px-4 py-3 rounded-lg mb-4"></div>
            <div id="signup-success" class="hidden bg-green-900/50 border border-green-700 text-green-300 px-4 py-3 rounded-lg mb-4"></div>

            <form id="signup-form" class="space-y-5">
                <div>
                    <label for="signup-email" class="block text-sm font-medium text-gray-300 mb-1">Seu E-mail</label>
                    <input type="email" id="signup-email" name="email" required
                        class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="seu@email.com">
                </div>

                <div>
                    <label for="signup-password" class="block text-sm font-medium text-gray-300 mb-1">Defina sua Senha</label>
                    <input type="password" id="signup-password" name="password" required minlength="6"
                        class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Mínimo 6 caracteres">
                </div>

                <div>
                    <label for="signup-password2" class="block text-sm font-medium text-gray-300 mb-1">Confirme a Senha</label>
                    <input type="password" id="signup-password2" required minlength="6"
                        class="w-full px-4 py-2.5 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                        placeholder="Repita a senha">
                </div>

                <button type="submit" id="signup-btn"
                    class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-800">
                    Criar Conta
                </button>
            </form>

            <p class="text-center text-gray-400 text-sm mt-6">
                Já tem uma conta? <a href="/login" class="text-indigo-400 hover:text-indigo-300">Faça login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/api.js?v={{ v }}"></script>
<script src="/static/js/auth.js?v={{ v }}"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

if (!token) {
    document.getElementById('signup-error').textContent = 'Link de convite inválido. Solicite um novo convite.';
    document.getElementById('signup-error').classList.remove('hidden');
    document.getElementById('signup-btn').disabled = true;
}

document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('signup-btn');
    const errorDiv = document.getElementById('signup-error');
    const successDiv = document.getElementById('signup-success');
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');

    const password = document.getElementById('signup-password').value;
    const password2 = document.getElementById('signup-password2').value;

    if (password !== password2) {
        errorDiv.textContent = 'As senhas não coincidem.';
        errorDiv.classList.remove('hidden');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Criando conta...';

    const email = document.getElementById('signup-email').value;

    try {
        await API.post(`/api/signup?token=${encodeURIComponent(token)}`, { email, password });
        successDiv.textContent = 'Conta criada com sucesso! Redirecionando para login...';
        successDiv.classList.remove('hidden');
        setTimeout(() => { window.location.href = '/login'; }, 2000);
    } catch (err) {
        errorDiv.textContent = err.message || 'Erro ao criar conta';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Criar Conta';
    }
});
</script>
{% endblock %}
