version: "3.8"

# =============================================
# DEV LOCAL — docker-compose up
# =============================================

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  video_api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - video_data:/data
    env_file:
      - .env
    depends_on:
      - redis

  video_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: rq worker -u ${REDIS_URL} video_jobs
    volumes:
      - .:/app
      - video_data:/data
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  video_data:
  redis_data:
